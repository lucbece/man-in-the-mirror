# Free on this repository: GitHub Actions bills nothing for public repos on
# standard runners. The local pre-commit hook exists anyway, because finding
# out from a red badge minutes after pushing is worse than finding out before
# the commit.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor package.json claims, and the version people actually run.
        # Both, because "works on my machine" is exactly what this is for.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` rather than `install`: it fails on a lockfile that disagrees with
      # package.json instead of quietly resolving something else, which is the
      # difference between testing this commit and testing something near it.
      - run: npm ci

      - run: npm run lint

      - run: npm test

  # The tests never make a network call, so a dependency that suddenly wants
  # one is worth knowing about. This is also the only place a supply-chain
  # problem in a voice bot holding three API keys would show up early.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Advisory: a high-severity finding in a transitive dependency should
      # interrupt someone's day, a moderate one in a dev tool should not.
      - run: npm audit --audit-level=high
