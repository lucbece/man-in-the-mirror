<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Man in the Mirror</title>
    <link rel="stylesheet" href="panel/components.css" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
  </head>
  <body>
    <div class="shell">
      <nav class="nav" aria-label="Sections">
        <a class="brand" href="#now"><img src="icon.svg" alt="" /><span data-t="app.title"></span></a>
        <a class="item" href="#now" data-section="now">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg><span data-t="nav.now"></span>
        </a>
        <div class="group" data-t="nav.settings"></div>
        <a class="item" href="#discord" data-section="discord">
          <svg viewBox="0 0 24 24"><path d="M4 6h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 3v-3H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><circle cx="9" cy="11.5" r=".9"/><circle cx="15" cy="11.5" r=".9"/></svg><span data-t="nav.discord"></span>
        </a>
        <a class="item" href="#keys" data-section="keys">
          <svg viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H20M17 12v3M20 12v2"/></svg><span data-t="nav.keys"></span>
        </a>
        <a class="item" href="#hearing" data-section="hearing">
          <svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 2.4-1.4 3.3-2.4 4.2-.9.8-1.6 1.5-1.6 3.3a2.5 2.5 0 0 1-5 0"/></svg><span data-t="nav.hearing"></span>
        </a>
        <a class="item" href="#listening" data-section="listening">
          <svg viewBox="0 0 24 24"><path d="M5 12h2M9 8v8M13 5v14M17 9v6M21 11v2"/></svg><span data-t="nav.listening"></span>
        </a>
        <a class="item" href="#thinking" data-section="thinking">
          <svg viewBox="0 0 24 24"><path d="M12 5.5a4 4 0 0 0-4 4v1a3 3 0 0 0-1 5.5V17a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1a3 3 0 0 0-1-5.5v-1a4 4 0 0 0-4-4Z"/><path d="M12 5.5V19"/></svg><span data-t="nav.thinking"></span>
        </a>
        <a class="item" href="#instructions" data-section="instructions">
          <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 12.5h6M9 16h4"/></svg><span data-t="nav.instructions"></span>
        </a>
        <a class="item" href="#tools" data-section="tools">
          <svg viewBox="0 0 24 24"><path d="M14.5 5.5a3.5 3.5 0 0 0 4 4l-8 8a2.1 2.1 0 0 1-3-3l8-8Z"/><path d="M5 19l1.5-1.5"/></svg><span data-t="nav.tools"></span>
        </a>
        <a class="item" href="#speaking" data-section="speaking">
          <svg viewBox="0 0 24 24"><path d="M4 10v4h3l4 3V7l-4 3H4Z"/><path d="M14.5 9.5a3.5 3.5 0 0 1 0 5M17 7a7 7 0 0 1 0 10"/></svg><span data-t="nav.speaking"></span>
        </a>
        <div class="foot">
          <span id="version"></span>
          <span class="seg small" id="langNav"></span>
        </div>
      </nav>

      <main class="main">
        <div class="topbar">
          <h1 id="title"></h1>
          <div class="actions">
            <span class="seg small" id="langTop" hidden></span>
            <span class="pill" id="status"><span class="dot"></span><span class="label"></span></span>
            <span id="topbarActions" class="row"></span>
          </div>
        </div>
        <div class="section" id="section"></div>
      </main>
    </div>

    <script type="module" src="panel/app.js"></script>
  </body>
</html>
