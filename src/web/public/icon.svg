<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Man in the Mirror">
  <title>Man in the Mirror</title>
  <!-- A round mirror. What is said on the left comes back on the right in
       the bot's colour: the same shape, the other material. -->
  <circle cx="32" cy="32" r="29" fill="#171a2b"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#e2bd4e" stroke-width="2.5"/>
  <line x1="32" y1="9" x2="32" y2="55" stroke="#e2bd4e" stroke-opacity="0.45" stroke-width="1"/>
  <g stroke-linecap="round" stroke-width="5.5">
    <g stroke="#eef0f8">
      <line x1="13" y1="28" x2="13" y2="36"/>
      <line x1="20" y1="23" x2="20" y2="41"/>
      <line x1="27" y1="17" x2="27" y2="47"/>
    </g>
    <g stroke="#e2bd4e">
      <line x1="37" y1="17" x2="37" y2="47"/>
      <line x1="44" y1="23" x2="44" y2="41"/>
      <line x1="51" y1="28" x2="51" y2="36"/>
    </g>
  </g>
</svg>
